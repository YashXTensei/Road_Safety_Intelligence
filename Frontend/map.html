<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>DriveSafe AI | Hazard Map</title>

    <link rel="stylesheet" href="map.css" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <!-- Routing CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body>
    <nav>
      <h2>
        <i class="fa-solid fa-road"></i>

        DriveSafe AI
      </h2>
    </nav>

    <section class="map-section">
      <h1>Road Hazard Intelligence Map</h1>

      <p>Real-time pothole locations detected by AI</p>

      <div class="hazard-counter" id="hazardCount">⚠️ Hazards Detected: 0</div>

      <!-- Map Legend -->
      <div class="map-legend">
        <span class="legend-item">
          <span class="legend-dot hazard"></span>
          Hazard Location
        </span>
        <span class="legend-item">
          <span class="legend-dot user"></span>
          Your Location
        </span>
      </div>

      <!-- CUSTOM MAP CONTROLS -->
      <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; flex-wrap: wrap;">
        <input type="text" id="destInput" placeholder="Enter destination (e.g. Connaught Place)" style="padding: 10px; width: 300px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px;" />
        <button id="routeBtn" style="background: #1e9e68; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold;"><i class="fa-solid fa-route"></i> Search Route</button>
        <button id="recenterBtn" style="background: #152c3d; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold;"><i class="fa-solid fa-location-crosshairs"></i> My Location</button>
      </div>

      <div id="map"></div>
    </section>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <!-- Routing JS -->
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

    <script src="map.js"></script>
  </body>
</html>
